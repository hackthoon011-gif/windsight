services:
  backend:
    build:
      context: ./backend
    ports:
      - "8000:8000"
    volumes:
      - windsight_cache:/app/cache
    environment:
      WINDSIGHT_CACHE_DIR: /app/cache
    restart: unless-stopped

  frontend:
    build:
      context: .
      args:
        VITE_API_BASE_URL: http://127.0.0.1:8000
    ports:
      - "8090:8080"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  windsight_cache:


